name: Home Assistant integration tests

on:
  push:
    paths: ["custom_components/**", "tests/ha/**", ".github/workflows/ha-tests.yml"]
  pull_request:
    paths: ["custom_components/**", "tests/ha/**", ".github/workflows/ha-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component PyTurboJPEG
      - run: pytest tests/ha -c tests/ha/pytest.ini -q
